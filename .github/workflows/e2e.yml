name: E2E

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database
        run: supabase db reset

      - name: Configure local Supabase environment
        shell: bash
        run: |
          status_env="$(supabase status -o env)"

          read_value() {
            printf '%s\n' "$status_env" |
              grep -E "^($1)=" |
              head -n 1 |
              sed -E 's/^[^=]+=//; s/^"//; s/"$//'
          }

          api_url="$(read_value 'API_URL')"
          publishable_key="$(read_value 'PUBLISHABLE_KEY|ANON_KEY')"
          secret_key="$(read_value 'SECRET_KEY|SERVICE_ROLE_KEY')"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "SUPABASE_SECRET_KEY=$secret_key"
          } > .env.local

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
